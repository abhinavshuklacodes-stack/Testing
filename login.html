<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Orcible</title><link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">o</span><span>orcible<span class="brand-dot">.</span></span></a><a class="back-link" href="index.html">← Back to home</a></header>
  <main class="auth-wrap">
    <section class="auth-aside"><div class="eyebrow"><span class="status-dot"></span> YOUR WORKSPACE AWAITS</div><h1>Good to have<br>you <span>back.</span></h1><p>Pick up where you left off. Your next great workflow starts here.</p><div class="decor-orbit"><span>o.</span><i></i><b></b></div></section>
    <section class="auth-card panel">
      <span class="section-kicker">WELCOME BACK</span><h2>Log in to Orcible</h2><p class="muted">Enter your account details to continue.</p>
      <form id="login-form">
        <label class="field-label" for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="Your username" required>
        <label class="field-label" for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required><button type="button" class="toggle-password" aria-label="Show password">◉</button></div>
        <div class="form-row"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><a href="#" id="forgot-link">Forgot password?</a></div>
        <button class="primary-btn full-btn" type="submit"><span>Log in</span><span class="button-arrow">↗</span></button>
        <p class="form-message" id="login-message" role="status"></p>
      </form>
      <div class="auth-switch">New to Orcible? <a href="register.html">Create an account</a></div>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
